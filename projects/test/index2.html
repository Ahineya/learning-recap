// Functions

const addItemToOrder = (order, item) => {
    order.push(item)
}

const calculateTotal = (order) => {
    let totalPrice = 0

    order.forEach((order) => {
        totalPrice = totalPrice + order.price
    })

    return totalPrice
}

    addItemToOrder(order, menu[1])
    addItemToOrder(order, menu[1])

    const total = calculateTotal(order)

    console.log(order)
    console.log(total)
}

main()
